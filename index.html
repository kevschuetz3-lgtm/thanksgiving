<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#74492b">
<title>Family Thanksgiving 2026</title>
<meta name="description" content="Thursday, November 26 · Pick a dish to bring and add your name.">
<meta property="og:type" content="website">
<meta property="og:title" content="Family Thanksgiving 2026">
<meta property="og:description" content="Thursday, November 26 · Pick a dish to bring and add your name.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@700;900&display=swap">
<style>
/* Layout: one white index card on a brown board. An orange line under the heading, tan ruled lines below; each dish sits on its own line with the name of whoever is bringing it. Type and colors are set for easy reading on a phone. */
:root {
  color-scheme: light;
  box-sizing: border-box;
  --board: #74492b;
  --card: #ffffff;
  --ink: #2b1a0f;
  --ink-soft: #6b4f3b;
  --rule: #ecdccb;
  --head-line: #e07a2e;
  --pencil: #9a420a;
  --accent: #b0500f;
  --accent-ink: #ffffff;
  --open-bg: #f6eadf;
  --open-ink: #5e3d24;
  --shadow: rgba(30, 15, 5, 0.4);
  --font-display: "Merriweather", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --board: #120b07;
    --card: #2b1c12;
    --ink: #fff7ef;
    --ink-soft: #e3cfbd;
    --rule: #4b3526;
    --head-line: #f08a3c;
    --pencil: #ffb36b;
    --accent: #ff9a4a;
    --accent-ink: #2b1c12;
    --open-bg: #3e2a1c;
    --open-ink: #f3dfcc;
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --board: #120b07;
  --card: #2b1c12;
  --ink: #fff7ef;
  --ink-soft: #e3cfbd;
  --rule: #4b3526;
  --head-line: #f08a3c;
  --pencil: #ffb36b;
  --accent: #ff9a4a;
  --accent-ink: #2b1c12;
  --open-bg: #3e2a1c;
  --open-ink: #f3dfcc;
  --shadow: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
[hidden] { display: none !important; }

body {
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--board);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.card {
  max-width: 680px;
  margin: 0 auto;
  background: var(--card);
  border-radius: 4px;
  box-shadow: 0 1px 2px var(--shadow), 0 24px 48px -28px var(--shadow);
  padding-block: 28px 20px;
  padding-inline: clamp(18px, 5vw, 40px);
}

.card-head {
  display: grid;
  gap: 10px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--head-line);
}
.eyebrow {
  margin: 0;
  font-size: 0.8125rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(2.4rem, 10vw, 3.5rem);
  line-height: 1.05;
  color: var(--accent);
  text-wrap: balance;
}
.when {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 2px 16px;
  font-size: 1rem;
}
.countdown { color: var(--accent); font-weight: 700; }
.summary { display: grid; gap: 8px; margin-top: 4px; }
.summary-line {
  margin: 0;
  font-size: 0.9375rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.summary-line strong { color: var(--ink); }
.bar { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.bar span { display: block; width: 0; height: 100%; border-radius: 4px; background: var(--pencil); }

.course {
  margin: 0;
  padding: 26px 0 8px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.1875rem;
  line-height: 1.3;
  color: var(--accent);
}
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) fit-content(46%);
  align-items: center;
  gap: 8px 16px;
  min-height: 44px;
  padding-block: 10px;
  border-bottom: 1px solid var(--rule);
}
.dish { min-width: 0; font-weight: 700; font-size: 1.125rem; line-height: 1.3; }
.who {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  text-align: right;
}
.name {
  font-weight: 700;
  font-size: 1.125rem;
  line-height: 1.25;
  color: var(--pencil);
  overflow-wrap: anywhere;
}
.notice { display: grid; gap: 12px; padding-top: 24px; }

.btn {
  appearance: none;
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 0.9375rem;
  line-height: 1.15;
  white-space: nowrap;
  padding: 9px 14px;
  border-radius: 4px;
  border: 2px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.link {
  border-color: transparent;
  background: transparent;
  color: var(--ink-soft);
  padding: 2px;
  font-size: 0.875rem;
  font-weight: 400;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn:disabled { opacity: 0.5; cursor: default; }
@media (hover: hover) {
  .btn:not(:disabled):hover { filter: brightness(1.1); }
  .btn.link:not(:disabled):hover { color: var(--ink); }
}
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }

.editor {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 12px;
}
.line-input {
  flex: 1 1 190px;
  min-width: 0;
  font-family: var(--font-body);
  font-size: 1.125rem;
  font-weight: 700;
  line-height: 1.3;
  color: var(--pencil);
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--pencil);
  border-radius: 0;
  padding: 4px 2px;
}
.line-input::placeholder { color: var(--ink-soft); font-weight: 400; opacity: 0.85; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fields { display: flex; flex-wrap: wrap; gap: 12px 16px; }
.add-form { display: grid; gap: 14px; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.foot { display: grid; gap: 12px; padding-top: 20px; }
.foot:empty { display: none; }
.note { margin: 0; max-width: 60ch; font-size: 0.9375rem; color: var(--ink-soft); }
.note b { color: var(--ink); }
.status { margin: 12px 0 0; min-height: 1.4em; font-size: 0.9375rem; color: var(--ink-soft); }
.status[data-tone="warn"] { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  'use strict';

  // Names are saved by a small Google Apps Script (apps-script/Code.js) in Kevin's "Family Thanksgiving 2026 — sign-ups" sheet.
  const API = 'https://script.google.com/macros/s/AKfycbw4zMzMtbsXacyYhIvrp5QkCYNobWnFLOwniofmm8h4NGPdxZjP_vbg88yyUe-SIat0nA/exec';
  const EVENT = { date: '2026-11-26', dateLabel: 'Thursday, November 26', guests: 16 };
  const EXTRA_COURSE = 'Also coming';
  const REFRESH_MS = 60000;
  const MESSAGES = {
    taken: 'Someone just signed up for that one. Pick another dish.',
    gone: 'That dish just came off the list.',
    not_yours: 'Only the person who signed up can change that one. Tell Kevin if it needs fixing.',
    full: "The list is full. Tell Kevin what you're bringing.",
    busy: 'Lots of people are saving right now. Try again in a moment.',
    network: "Couldn't save just now. Check your connection and try again.",
  };

  const root = document.getElementById('root');
  const view = { loaded: false, failed: false, saving: false, editing: null, draft: null, adding: false, addDraft: { dish: '', by: '' } };
  let items = [];
  let writes = 0;

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage blocked */ } },
  };

  // This browser's private key. The sheet keeps a hash of it beside each sign-up, so only the phone or computer
  // that signed up for a dish can change it from the page.
  const token = (() => {
    const saved = store.get('tg26-token');
    if (/^[A-Za-z0-9_-]{16,64}$/.test(saved || '')) return saved;
    const bytes = crypto.getRandomValues(new Uint8Array(18));
    const fresh = btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_');
    store.set('tg26-token', fresh);
    return fresh;
  })();

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const clean = (v) => String(v || '').replace(/\s+/g, ' ').trim().slice(0, 40);
  const findItem = (id) => items.find((i) => i.id === id);
  const cssId = (v) => (window.CSS && CSS.escape ? CSS.escape(v) : String(v));
  const slug = (v) => String(v).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'list';
  const isExtra = (item) => item.course === EXTRA_COURSE;

  async function call(body) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(API, {
        method: 'POST',
        // text/plain keeps this a simple request, which Apps Script answers without a CORS preflight.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ token }, body)),
        signal: ctrl.signal,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function daysToGo() {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(EVENT.date);
    if (!m) return '';
    const day = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const d = Math.round((day - today) / 86400000);
    if (d > 1) return d + ' days to go';
    if (d === 1) return 'Tomorrow';
    if (d === 0) return 'Today';
    return '';
  }

  function renderShell() {
    const countdown = daysToGo();
    root.innerHTML = `
      <article class="card">
        <header class="card-head">
          <p class="eyebrow">Family sign-up sheet · 2026</p>
          <h1 class="title">Thanksgiving</h1>
          <p class="when"><b>${esc(EVENT.dateLabel)}</b><span>Dinner for ${esc(EVENT.guests)}</span>${countdown ? `<span class="countdown">${esc(countdown)}</span>` : ''}</p>
          <div class="summary" id="summary" hidden></div>
        </header>
        <div class="menu" id="menu"></div>
        <footer class="foot" id="foot"></footer>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </article>`;
  }

  function renderSummary() {
    const box = document.getElementById('summary');
    box.hidden = !view.loaded;
    if (!view.loaded) return;
    const total = items.length;
    const claimed = items.filter((i) => i.by).length;
    const open = total - claimed;
    box.innerHTML = `
      <p class="summary-line">${open === 0 && total ? `All ${total} dishes are claimed.` : `<strong>${claimed}</strong> of ${total} dishes claimed · <strong>${open}</strong> still open`}</p>
      <div class="bar" aria-hidden="true"><span></span></div>`;
    box.querySelector('.bar span').style.width = (total ? Math.round((claimed / total) * 100) : 0) + '%';
  }

  function renderMenu() {
    const menu = document.getElementById('menu');
    if (!view.loaded) {
      menu.innerHTML = view.failed
        ? `<div class="notice"><p class="note">Couldn't load the list. Check your connection, then try again.</p>
             <div class="actions"><button type="button" class="btn ghost" data-act="retry">Try again</button></div></div>`
        : '<div class="notice"><p class="note">Loading the list…</p></div>';
      return;
    }
    const groups = [];
    items.forEach((item) => {
      const label = isExtra(item) ? EXTRA_COURSE : item.course;
      let group = groups.find((g) => g.label === label);
      if (!group) groups.push((group = { label, items: [] }));
      group.items.push(item);
    });
    // Dishes people add go last, under "Also coming".
    groups.sort((a, b) => (a.label === EXTRA_COURSE) - (b.label === EXTRA_COURSE));
    menu.innerHTML = groups
      .map((g) => `
        <section aria-labelledby="course-${esc(slug(g.label))}">
          <h2 class="course" id="course-${esc(slug(g.label))}">${esc(g.label)}</h2>
          <ul class="rows">${g.items.map(rowHtml).join('')}</ul>
        </section>`)
      .join('');
  }

  function rowHtml(item) {
    const id = esc(item.id);
    const dish = esc(item.dish);
    let side;
    if (view.editing === item.id) {
      side = editorHtml(item);
    } else if (item.by) {
      side = `<div class="who"><span class="name">${esc(item.by)}</span>${item.mine ? `<button type="button" class="btn link" data-act="edit" data-id="${id}" aria-label="Change your sign-up for ${dish}">change</button>` : ''}</div>`;
    } else {
      side = `<div class="who"><button type="button" class="btn ghost" data-act="edit" data-id="${id}" aria-label="Sign up for ${dish}">Sign up</button></div>`;
    }
    return `
      <li class="row">
        <div class="dish">${dish}</div>
        ${side}
      </li>`;
  }

  function editorHtml(item) {
    const id = esc(item.id);
    const value = view.draft != null ? view.draft : item.mine ? item.by : store.get('tg26-name') || '';
    let second = '';
    if (item.mine) second = `<button type="button" class="btn ghost" data-act="clear" data-id="${id}">${isExtra(item) ? 'Delete dish' : 'Remove name'}</button>`;
    return `
      <form class="editor" data-id="${id}">
        <label class="sr-only" for="who-${id}">Who's bringing ${esc(item.dish)}?</label>
        <input class="line-input" id="who-${id}" name="who" maxlength="40" autocomplete="name" placeholder="Your name" value="${esc(value)}">
        <div class="actions">
          <button type="submit" class="btn">Save</button>
          ${second}
          <button type="button" class="btn link" data-act="cancel" data-id="${id}">Cancel</button>
        </div>
      </form>`;
  }

  function renderFoot() {
    const foot = document.getElementById('foot');
    if (!view.loaded) {
      foot.innerHTML = '';
    } else if (view.adding) {
      foot.innerHTML = `
        <form class="add-form" id="add-form">
          <p class="note">Bringing something that isn't on the list? Add it here.</p>
          <div class="fields">
            <label class="sr-only" for="add-dish">Dish</label>
            <input class="line-input" id="add-dish" name="dish" maxlength="40" autocomplete="off" placeholder="Dish" value="${esc(view.addDraft.dish)}">
            <label class="sr-only" for="add-who">Your name</label>
            <input class="line-input" id="add-who" name="who" maxlength="40" autocomplete="name" placeholder="Your name" value="${esc(view.addDraft.by)}">
          </div>
          <div class="actions">
            <button type="submit" class="btn">Add dish</button>
            <button type="button" class="btn link" data-act="cancel-add">Cancel</button>
          </div>
        </form>`;
    } else {
      foot.innerHTML = `
        <p class="note">Tap <b>Sign up</b> next to a dish and add your name. You can change your sign-up later from this same phone or computer, or just tell Kevin.</p>
        <div class="actions"><button type="button" class="btn ghost" data-act="add">+ Add a dish</button></div>`;
    }
  }

  function render() {
    renderSummary();
    renderMenu();
    renderFoot();
  }

  function setStatus(text, tone) {
    const el = document.getElementById('status');
    el.textContent = text || '';
    if (tone) el.dataset.tone = tone;
    else delete el.dataset.tone;
  }

  function setBusy(on) {
    root.querySelectorAll('button, input').forEach((el) => { el.disabled = on; });
  }

  function focusLater(selector) {
    requestAnimationFrame(() => {
      const el = root.querySelector(selector);
      if (!el) return;
      el.focus();
      if (el.select && el.value) el.select();
    });
  }

  async function load() {
    if (view.saving) return;
    const seen = writes;
    try {
      const out = await call({ action: 'list' });
      if (!out || !out.ok || !Array.isArray(out.items)) throw new Error((out && out.code) || 'bad reply');
      // A save that started meanwhile brings back a newer list of its own.
      if (seen !== writes || view.saving) return;
      items = out.items;
      view.loaded = true;
      view.failed = false;
    } catch (e) {
      if (!view.loaded) view.failed = true;
    }
    // Never redraw under someone who is typing; their save brings the fresh list back anyway.
    if (!view.saving && !view.editing && !view.adding) render();
  }

  async function commit(body, done) {
    if (view.saving) return false;
    view.saving = true;
    writes += 1;
    setBusy(true);
    setStatus('Saving…');
    let out = null;
    try {
      out = await call(body);
    } catch (e) {
      out = null;
    }
    view.saving = false;
    if (out && Array.isArray(out.items)) {
      items = out.items;
      view.loaded = true;
    }
    if (out && out.ok) {
      view.editing = null;
      view.draft = null;
      view.adding = false;
      render();
      setStatus(done);
      return true;
    }
    const code = (out && out.code) || 'network';
    if (code === 'taken' || code === 'gone' || code === 'not_yours') {
      view.editing = null;
      view.draft = null;
      render();
    } else {
      setBusy(false);
    }
    setStatus(MESSAGES[code] || MESSAGES.network, 'warn');
    return false;
  }

  root.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn || view.saving) return;
    const id = btn.dataset.id;
    switch (btn.dataset.act) {
      case 'edit':
        view.editing = id;
        view.draft = null;
        view.adding = false;
        setStatus('');
        render();
        focusLater('#who-' + cssId(id));
        break;
      case 'cancel':
        view.editing = null;
        view.draft = null;
        render();
        focusLater(`button[data-act="edit"][data-id="${cssId(id)}"]`);
        break;
      case 'clear': {
        const item = findItem(id);
        commit({ action: 'clear', id }, item && isExtra(item) ? 'Dish removed.' : 'Name removed.');
        break;
      }
      case 'add':
        view.adding = true;
        view.editing = null;
        view.addDraft = { dish: '', by: store.get('tg26-name') || '' };
        setStatus('');
        render();
        focusLater('#add-dish');
        break;
      case 'cancel-add':
        view.adding = false;
        render();
        break;
      case 'retry':
        view.failed = false;
        render();
        load();
        break;
    }
  });

  root.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (view.saving) return;
    const form = e.target;
    if (form.classList.contains('editor')) {
      const id = form.dataset.id;
      const by = clean(form.elements.who.value);
      if (!by) {
        setStatus('Type your name first, or tap Cancel.', 'warn');
        form.elements.who.focus();
        return;
      }
      view.draft = by;
      if (await commit({ action: 'claim', id, by }, `Saved. Thanks, ${by}!`)) store.set('tg26-name', by);
    } else if (form.id === 'add-form') {
      const dish = clean(form.elements.dish.value);
      const by = clean(form.elements.who.value);
      view.addDraft = { dish, by };
      if (!dish) {
        setStatus('Type the dish first.', 'warn');
        form.elements.dish.focus();
        return;
      }
      if (!by) {
        setStatus('Add your name too, so everyone knows who is bringing it.', 'warn');
        form.elements.who.focus();
        return;
      }
      if (await commit({ action: 'add', dish, by }, `Added. Thanks, ${by}!`)) store.set('tg26-name', by);
    }
  });

  root.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || view.saving) return;
    if (view.editing) {
      const id = view.editing;
      view.editing = null;
      view.draft = null;
      render();
      focusLater(`button[data-act="edit"][data-id="${cssId(id)}"]`);
    } else if (view.adding) {
      view.adding = false;
      render();
    }
  });

  renderShell();
  render();
  load();
  // Pick up other people's sign-ups while the page is open, and as soon as someone comes back to it.
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && view.loaded) load(); });
})();
</script>
</body>
</html>
